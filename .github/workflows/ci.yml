name: Selyra OS CI

on:
  push:
    branches: [main, selyra-0.0.9]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build IPC programs
        run: make build/statusd build/statusctl

      - name: Run IPC tests
        run: make test

      - name: Test peer authentication
        run: bash tests/test-ipc-auth.sh

      - name: Build Selyra system components
        run: make build/init build/powerctl

      - name: Run Selyra system tests
        run: |
          make test-logs
          make test-memory
          make test-cpu
          make test-system
          make test-power
          make test-power-socket
          make test-powerctl
          make test-shutdown-state
          make test-power-transition
