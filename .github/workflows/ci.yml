name: Selyra OS CI

on:
  push:
    branches: [main, selyra-0.3.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate SemVer
        run: make test-version

      - name: Build IPC programs
        run: make build/statusd build/statusctl

      - name: Run IPC tests
        run: make test

      - name: Verify test user permissions
        run: |
          test "$(sudo -n id -u)" = "0"
          test "$(sudo -n runuser -u nobody -- id -u)" = "65534"

      - name: Test peer authentication
        run: bash tests/test-ipc-auth.sh

      - name: Test environment compatibility
        run: bash tests/test-env-compat.sh

      - name: Check legacy technical paths
        run: |
          if git grep -n 'mobile-os' -- Makefile src config scripts tests; then
            echo "::error::Legacy technical path found"
            exit 1
          fi

      - name: Build Selyra system components
        run: make build/init build/powerctl

      - name: Run Selyra system tests
        run: |
          make test-logs
          make test-memory
          make test-cpu
          make test-system
          make test-power
          make test-power-socket
          make test-powerctl
          make test-shutdown-state
          make test-power-transition

      - name: Run configuration and service management tests
        run: make test-management

      - name: Verify management IPC authorization
        run: |
          sudo -n ./build/test-service-control
          sudo -n /usr/bin/python3 tests/test-config-peer.py

  armv7-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            qemu-system-arm \
            fakeroot cpio file curl

      - name: Validate version
        run: make test-version

      - name: Build ARMv7 programs
        run: bash scripts/build-s3.sh

      - name: Prepare ARMv7 boot image
        run: bash scripts/prepare-armv7-qemu.sh

      - name: Verify ARMv7 image
        run: python3 scripts/check-armv7-image.py

      - name: Boot Selyra in ARM QEMU
        run: make test-arm-boot

  x86-64-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      LC_ALL: C

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install x86-64 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libc6-dev python3 \
            qemu-system-x86 qemu-utils \
            fakeroot cpio gzip file e2fsprogs

      - name: Prepare Linux kernel
        run: |
          mkdir -p build
          kernel_pkg=$(apt-cache depends linux-image-generic | awk '$1 == "Depends:" && $2 ~ /^linux-image-[0-9].*-generic$/ {print $2; exit}')
          test -n "$kernel_pkg"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          (
            cd "$work"
            apt-get download "$kernel_pkg"
            dpkg-deb -x ./*.deb extracted
          )
          install -m 0644 "$work/extracted/boot/vmlinuz-${kernel_pkg#linux-image-}" build/vmlinuz
          file build/vmlinuz
          sha256sum build/vmlinuz

      - name: Run system regression tests
        run: make check

      - name: Verify QEMU IPC authorization
        run: bash tests/test-qemu-ipc-auth.sh

      - name: Verify logging authorization
        run: make test-log-auth

      - name: Verify power management
        run: |
          make test-qemu-power
          make test-qemu-poweroff
          make test-qemu-reboot
          make test-qemu-force-poweroff

      - name: Verify persistent storage
        run: make test-storage

      - name: Verify dynamic service management
        run: make test-service-management

      - name: Verify persistent service policies
        run: make test-service-policy-boot

      - name: Verify persistent system configuration
        run: make test-config-boot
