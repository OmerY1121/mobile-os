name: Selyra OS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build IPC programs
        run: make build/statusd build/statusctl

      - name: Run IPC tests
        run: make test

      - name: Test peer authentication
        run: bash tests/test-ipc-auth.sh
